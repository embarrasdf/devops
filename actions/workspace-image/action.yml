name: Build workspace image
description: >
  Builds and pushes a workspace image: the kmp-toolchain image plus the Gradle,
  Kotlin/Native and Kotlin npm caches from building the repos that
  ctx/workspace.repos lists, checked out side by side in ctx/. Expects a docker
  login to ghcr.io.

inputs:
  image:
    description: Image name without a tag.
    required: true
  toolchain:
    description: Toolchain image to build on.
    default: ghcr.io/embarrasdf/kmp-toolchain:latest

outputs:
  image:
    description: The image name, without a tag.
    value: ${{ steps.names.outputs.image }}

runs:
  using: composite
  steps:
    # A workspace image builds several repos in one go, which needs more disk than a
    # runner leaves free. The build brings its own JDK and Android SDK, so the
    # runner's preinstalled ones can go. When the disk fills, the runner dies
    # without uploading the job's log.
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        df -h /

    - name: Prepare the build
      id: names
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        image="$IMAGE"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        # Build on the previous image when there is one, so only changes download.
        if docker manifest inspect "$image:latest" > /dev/null 2>&1; then
          echo "previous=$image:latest" >> "$GITHUB_OUTPUT"
        else
          echo "previous=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
        fi
        echo "Building $image from:"; cat ctx/workspace.repos
        cp "$GITHUB_ACTION_PATH/warm.sh" ctx/warm.sh

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ctx
        file: ${{ github.action_path }}/Dockerfile
        build-args: |
          TOOLCHAIN=${{ inputs.toolchain }}
          PREVIOUS=${{ steps.names.outputs.previous }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        push: true
        tags: |
          ${{ steps.names.outputs.image }}:latest
          ${{ steps.names.outputs.image }}:sha-${{ github.sha }}
