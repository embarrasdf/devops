name: Clone repos side by side
description: >
  Clones every repo in a workspace list into one folder, the way a cloud session
  lays them out, and writes workspace.repos there for the cache-image action.

inputs:
  repos-file:
    description: >
      The list. Each line is "<owner>/<repo> <gradle task> [<gradle task> ...]";
      blank lines and lines starting with # are skipped.
    required: true
  app-id:
    description: >
      ID of a GitHub App installed on every owner in the list with read access
      to its repos. A read-only token is made for each owner.
    default: ''
  app-private-key:
    description: The GitHub App's private key.
    default: ''
  token:
    description: Instead of an app, a token that can read every repo in the list.
    default: ''
  path:
    description: Folder to clone into.
    default: ctx

runs:
  using: composite
  steps:
    - name: Clone
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        TOKEN: ${{ inputs.token }}
        REPOS_FILE: ${{ inputs.repos-file }}
        DEST: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/clone.sh" "$REPOS_FILE" "$DEST"
