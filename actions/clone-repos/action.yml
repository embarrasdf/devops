name: Clone repos side by side
description: >
  Clones every repo in a workspace list into one folder, the way a cloud session
  lays them out, and writes workspace.repos there for the cache-image action.

inputs:
  repos-file:
    description: >
      The list, or several separated by spaces. Each line is
      "<owner>/<repo> <gradle task> [<gradle task> ...]"; blank lines and lines
      starting with # are skipped. A repo in more than one list is cloned once.
    required: true
  app-id:
    description: >
      ID of a GitHub App with read access to the private repos in the list,
      installed on each of their owners. A read-only token is made per owner;
      an owner without the app gets its public repos cloned anonymously.
    default: ''
  app-private-key:
    description: The GitHub App's private key.
    default: ''
  token:
    description: Instead of an app, a token that can read every repo in the list.
    default: ''
  path:
    description: Folder to clone into.
    default: ctx

runs:
  using: composite
  steps:
    - name: Clone
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        TOKEN: ${{ inputs.token }}
        REPOS_FILE: ${{ inputs.repos-file }}
        DEST: ${{ inputs.path }}
      run: |
        read -ra lists <<< "$REPOS_FILE"
        bash "$GITHUB_ACTION_PATH/clone.sh" "$DEST" "${lists[@]}"
