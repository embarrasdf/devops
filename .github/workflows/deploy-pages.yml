# Reusable workflow: builds an app's web app and deploys it to GitHub Pages.
#
# Call it from a repo like this (the caller decides when it runs):
#
#   name: Deploy to GitHub Pages
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   concurrency:
#     group: ${{ github.workflow }}
#     cancel-in-progress: false
#   jobs:
#     app:
#       name: Palette
#       uses: embarrasdf/devops/.github/workflows/deploy-pages.yml@main
#       permissions: { contents: read, pages: write, id-token: write }
#       with:
#         app-dir: app
#
# app-dir is the folder that holds the app's webApp module (see actions/app-info). A repo has one
# Pages site, so only one app can deploy to it.

name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      app-dir:
        description: The app folder.
        type: string
        default: '.'
      lfs:
        description: Download Git LFS files.
        type: boolean
        default: false
      gradle-args:
        description: Extra arguments for each Gradle call, separated by spaces.
        type: string
        default: ''

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Set up the build
        uses: embarrasdf/devops/actions/gradle-setup@main
        with:
          lfs: ${{ inputs.lfs }}

      - name: Describe the app
        id: app
        uses: embarrasdf/devops/actions/app-info@main
        with:
          app-dir: ${{ inputs.app-dir }}

      - name: Build
        env:
          PREFIX: ${{ steps.app.outputs.gradle-prefix }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: |
          read -ra args <<< "${PREFIX}webApp:wasmJsBrowserDistribution $GRADLE_ARGS"
          ./gradlew "${args[@]}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.app.outputs.dir }}/webApp/build/dist/wasmJs/productionExecutable/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
