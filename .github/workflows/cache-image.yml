# Reusable workflow: builds the calling repo's cache image.
#
# Call it from a repo like this (the caller decides when it runs):
#
#   jobs:
#     cache-image:
#       uses: embarrasdf/devops/.github/workflows/cache-image.yml@main
#       permissions: { contents: read, packages: write }
#       with:
#         warm-tasks: ":lib:assemble :lib:compileTestKotlinJvm"
#
# It runs as the calling repo, so the built-in GITHUB_TOKEN can read that repo
# and push its image. The caller's repo needs read access to the kmp-toolchain
# package (package settings > Manage Actions access).

name: Cache image

on:
  workflow_call:
    inputs:
      warm-tasks:
        description: Gradle tasks to run while filling the caches, separated by spaces.
        type: string
        required: true
      toolchain:
        description: Toolchain image to build on.
        type: string
        default: ghcr.io/embarrasdf/kmp-toolchain:latest
    outputs:
      image:
        description: The image name, without a tag.
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build cache image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          path: ctx/repo
          # The release plugin derives the version from tags.
          fetch-depth: 0

      - name: Check out gradle-plugins beside it
        uses: actions/checkout@v7
        with:
          repository: embarrasdf/gradle-plugins
          path: ctx/gradle-plugins

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: embarrasdf/devops/actions/cache-image@main
        with:
          warm-tasks: ${{ inputs.warm-tasks }}
          toolchain: ${{ inputs.toolchain }}
