# Builds ghcr.io/embarrasdf/<workspace>-workspace for cloud sessions: one image
# with the caches from building every repo in workspace/<workspace>.repos.
# To add a workspace, add its list file and its name to the matrix.

name: Build workspace image

on:
  push:
    branches:
      - main
    paths:
      - 'workspace/**'
      - 'actions/cache-image/**'
      - '.github/workflows/build-workspace-image.yml'
  workflow_dispatch:
  schedule:
    # Nightly, to pick up what merged in the workspace's repos.
    - cron: '41 7 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.workspace }}-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - embarrasdf

    steps:
      - name: Check out devops
        uses: actions/checkout@v7
        with:
          path: devops

      # This repo's own token can't read other private repos, so a GitHub App
      # installed on the workspace's owner provides one.
      - name: Get a token that can read the workspace's repos
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKSPACE_APP_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.workspace }}

      - name: Clone the workspace's repos
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: bash devops/workspace/clone.sh "devops/workspace/${{ matrix.workspace }}.repos" ctx

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: ./devops/actions/cache-image
        with:
          image: ghcr.io/embarrasdf/${{ matrix.workspace }}-workspace
