name: Build toolchain image

on:
  push:
    branches:
      - main
    paths:
      - 'toolchain/**'
      - '.github/workflows/build-toolchain.yml'
  workflow_dispatch:
  schedule:
    # Monthly, to pick up Ubuntu security updates.
    - cron: '23 5 1 * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build toolchain image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          push: true
          tags: |
            ghcr.io/embarrasdf/kmp-toolchain:latest
            ghcr.io/embarrasdf/kmp-toolchain:sha-${{ github.sha }}
