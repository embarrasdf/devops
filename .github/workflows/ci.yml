# Reusable workflow: tests, formatting and static analysis for an embarrasdf Gradle repo.
#
# Call it from a repo like this (the caller decides when it runs):
#
#   name: CI
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       name: CI
#       uses: embarrasdf/devops/.github/workflows/ci.yml@main
#       permissions: { contents: write, pull-requests: write, security-events: write }
#       secrets:
#         embarrassdf-bot-private-key: ${{ secrets.EMBARRASSDF_BOT_PRIVATE_KEY }}
#
# The default tasks come from gradle-plugins: embarrasdfTest runs everything a Linux runner can
# (JVM, Android unit and browser tests), and embarrasdfTestApple runs the iOS simulator tests on
# macOS. Set apple-test-tasks to '' for a repo with no iOS tests worth the macOS minutes.
#
# Static analysis runs embarrasdfStaticAnalysis and fails on any finding. Findings go to the job
# summary, to code scanning on public repos (SARIF, which needs security-events: write), and to a
# comment on same-repo pull requests. To skip type resolution, set
# embarrasdf.staticAnalysis.typeResolution=false in the repo's gradle.properties.
#
# Dependency locks run in a repo with embarrasdf.dependencyLocking=true in its gradle.properties
# (see gradle-plugins). They rewrite the lockfiles; on a same-repo pull request, changes are
# committed by the embarrassdf-bot GitHub App, so CI runs again on the new commit. Its client ID
# is the EMBARRASSDF_BOT_CLIENT_ID variable, and its key is passed as the
# embarrassdf-bot-private-key secret. Elsewhere, or without the App, a change fails the job.
# When the locks are current, the job reports what moved against the base branch in a comment and
# in the dependency-report artifact, which the dependency review reads.

name: CI

on:
  workflow_call:
    inputs:
      test-tasks:
        description: Gradle tasks to run on Linux. '' skips the job.
        type: string
        default: embarrasdfTest
      apple-test-tasks:
        description: Gradle tasks to run on macOS. '' skips the job.
        type: string
        default: embarrasdfTestApple
      screenshot-tests:
        description: >
          Verify Paparazzi screenshots. On a pull request from this repo, screenshots that changed
          are recorded and committed to the branch.
        type: boolean
        default: false
      format:
        description: Run the format workflow.
        type: boolean
        default: true
      static-analysis:
        description: Run static analysis.
        type: boolean
        default: true
      lfs:
        description: Download Git LFS files.
        type: boolean
        default: false
      dependency-locks:
        description: Check the Gradle lockfiles, in a repo that locks dependencies.
        type: boolean
        default: true
      gradle-args:
        description: Extra arguments for each Gradle call, separated by spaces.
        type: string
        default: ''
    secrets:
      embarrassdf-bot-private-key:
        description: Private key of the embarrassdf-bot GitHub App, which commits lockfiles.
        required: false

jobs:
  test:
    name: Test
    if: inputs.test-tasks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Set up the build
        uses: embarrasdf/devops/actions/gradle-setup@main
        with:
          lfs: ${{ inputs.lfs }}

      - name: Run tests
        env:
          TASKS: ${{ inputs.test-tasks }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: |
          read -ra args <<< "$TASKS $GRADLE_ARGS"
          ./gradlew "${args[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  test-apple:
    name: Test (Apple)
    if: inputs.apple-test-tasks != ''
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Set up the build
        uses: embarrasdf/devops/actions/gradle-setup@main
        with:
          lfs: ${{ inputs.lfs }}

      - name: Run tests
        env:
          TASKS: ${{ inputs.apple-test-tasks }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: |
          read -ra args <<< "$TASKS $GRADLE_ARGS"
          ./gradlew "${args[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-apple
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  screenshot-tests:
    name: Screenshot Tests
    if: inputs.screenshot-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up the build
        uses: embarrasdf/devops/actions/gradle-setup@main
        with:
          # The pull request branch rather than the merge commit, so screenshots can be pushed to it.
          ref: ${{ github.head_ref || github.ref }}
          lfs: ${{ inputs.lfs }}

      - name: Run screenshot tests
        uses: embarrasdf/devops/actions/screenshot-tests@main
        with:
          gradle-args: ${{ inputs.gradle-args }}

  format:
    if: inputs.format
    uses: embarrasdf/devops/.github/workflows/format.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      gradle-args: ${{ inputs.gradle-args }}

  static-analysis:
    name: Static Analysis
    if: inputs.static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Set up the build
        uses: embarrasdf/devops/actions/gradle-setup@main
        with:
          lfs: ${{ inputs.lfs }}
          # The static analysis action posts its own comment listing the findings.
          add-job-summary-as-pr-comment: 'never'

      - name: Run static analysis
        uses: embarrasdf/devops/actions/static-analysis@main
        with:
          gradle-args: ${{ inputs.gradle-args }}

  dependency-locks:
    name: Dependency Locks
    if: inputs.dependency-locks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      # Secrets can't be read in a step's if, so this says whether the caller passed the key.
      HAS_BOT_KEY: ${{ secrets.embarrassdf-bot-private-key != '' }}
    steps:
      - name: Get the embarrassdf-bot token
        id: bot
        # Only for pull requests from this repo, whose callers pass the App's key: fork pull
        # requests get no secrets.
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          vars.EMBARRASSDF_BOT_CLIENT_ID != '' && env.HAS_BOT_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.EMBARRASSDF_BOT_CLIENT_ID }}
          private-key: ${{ secrets.embarrassdf-bot-private-key }}
          permission-contents: write

      - name: Set up the build
        uses: embarrasdf/devops/actions/gradle-setup@main
        with:
          # The pull request branch rather than the merge commit, so lockfiles can be pushed to it.
          ref: ${{ github.head_ref || github.ref }}
          add-job-summary-as-pr-comment: 'never'

      - name: Check the dependency locks
        uses: embarrasdf/devops/actions/dependency-locks@main
        with:
          token: ${{ steps.bot.outputs.token }}
          app-slug: ${{ steps.bot.outputs.app-slug }}
          gradle-args: ${{ inputs.gradle-args }}
